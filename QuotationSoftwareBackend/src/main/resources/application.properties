spring.application.name=QuotationSoftwareBackend
# Render assigns the listen port via the PORT env var; 8080 stays the local default.
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:quotation_db}

spring.main.allow-circular-references=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
# Set these in the backend environment; never commit SMTP credentials.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

spring.devtools.restart.enabled=false

# Increase max request size to handle Base64 images (set to 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.max-http-header-size=1MB

# ===== Deployment-specific settings =====
# Base URL of THIS backend, used when building links emailed to clients
# (quotation approve/reject). Set APP_BASE_URL to the Render service URL in production.
# No trailing slash — it's concatenated directly with "/api/...".
app.base-url=${APP_BASE_URL:https://quotation-v1-y2m6.onrender.com}
# URL of the deployed frontend. Used for password-reset links.
app.frontend-url=${APP_FRONTEND_URL:https://quotation-v1-pi.vercel.app}
app.cors.allowed-origin=${APP_FRONTEND_URL:https://quotation-v1-pi.vercel.app}
app.cors.allowed-origins=${APP_CORS_ORIGINS:https://quotation-v1-pi.vercel.app}
# JWT signing secret — override with a real secret via JWT_SECRET in production.
security.jwt.secret=${JWT_SECRET}
