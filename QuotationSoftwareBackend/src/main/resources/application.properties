# ===== Deployment-specific settings =====
# Base URL of THIS backend, used when building links emailed to clients
# (quotation approve/reject). Set APP_BASE_URL to the Render service URL in production.
# No trailing slash — it's concatenated directly with "/api/...".
app.base-url=${APP_BASE_URL:https://quotation-v1-y2m6.onrender.com}
# URL of the deployed frontend. Used for the password-reset email link.
# Set APP_FRONTEND_URL to the deployed frontend URL in production.
app.frontend-url=${APP_FRONTEND_URL:https://quotation-v1-pi.vercel.app}
# Comma-separated list of origins allowed to call this API. Keeps the deployed
# Vercel frontend AND a local "npm run dev" (localhost:5173) both working at once.
# Override with APP_CORS_ORIGINS (comma-separated) to add/replace entries.
app.cors.allowed-origins=${APP_CORS_ORIGINS:https://quotation-v1-pi.vercel.app,http://localhost:5173}
